name: Set up Android build
description: Install the JDK and SDK used by this project and cache Gradle dependencies.
inputs:
  cache-read-only:
    description: Allow only the default branch to write the shared Gradle cache.
    default: ${{ github.ref != 'refs/heads/main' }}
runs:
  using: composite
  steps:
    - uses: actions/setup-java@v6
      with:
        distribution: temurin
        java-version: '25'
    - uses: android-actions/setup-android@v4
      with:
        packages: 'platform-tools platforms;android-36.1 build-tools;36.0.0'
        log-accepted-android-sdk-licenses: 'false'
    # Also validates the checked-in Gradle wrapper. Avoid a second cache in setup-java.
    - uses: gradle/actions/setup-gradle@v6
      with:
        cache-provider: basic
        cache-read-only: ${{ inputs.cache-read-only }}
